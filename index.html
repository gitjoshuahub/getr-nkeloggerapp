<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KoeWi Bierlogger</title>
<meta name="theme-color" content="#c9a227">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#111318; --card:#1c1f27; --accent:#c9a227; --accent2:#e6c34a;
    --text:#f2f2f2; --muted:#9aa0aa; --danger:#d9534f; --ok:#4caf50;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; flex-direction:column;
  }
  header{
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg,#1a1d24,#111318); position:sticky; top:0; z-index:10;
    border-bottom:1px solid #2a2d36;
  }
  header h1{font-size:18px; margin:0; color:var(--accent2);}
  #statusDot{width:10px;height:10px;border-radius:50%;background:var(--danger); display:inline-block; margin-right:6px;}
  #statusDot.online{background:var(--ok);}
  main{flex:1; padding:16px; max-width:480px; margin:0 auto; width:100%;}
  .card{background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,.3);}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  button{
    font-size:16px; padding:14px 10px; border-radius:10px; border:none;
    background:#2a2d36; color:var(--text); cursor:pointer; transition:.15s;
  }
  button:active{transform:scale(0.97);}
  .btn-accent{background:var(--accent); color:#111;}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-ok{background:var(--ok); color:#111;}
  .btn-full{grid-column:1/-1; width:100%;}
  .name-list{display:flex; flex-wrap:wrap; gap:8px;}
  .name-list button{flex:1 1 auto; min-width:90px;}
  select, input{
    width:100%; padding:12px; border-radius:10px; border:1px solid #333;
    background:#0f1116; color:var(--text); font-size:16px; margin-bottom:10px;
  }
  h2{font-size:15px; color:var(--muted); margin:0 0 10px; text-transform:uppercase; letter-spacing:.5px;}
  #toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#222; color:#fff; padding:12px 20px; border-radius:10px;
    opacity:0; transition:.3s; pointer-events:none; max-width:90%; text-align:center; z-index:999;
  }
  #toast.show{opacity:1;}
  .queueBadge{
    background:var(--danger); color:#fff; border-radius:20px; padding:2px 8px; font-size:12px; margin-left:6px;
  }
  .tabbar{
    position:sticky; bottom:0; display:flex; background:#161920; border-top:1px solid #2a2d36;
  }
  .tabbar button{flex:1; border-radius:0; background:transparent; padding:12px 0; font-size:13px;}
  .tabbar button.active{color:var(--accent2); border-top:2px solid var(--accent2);}
  .hidden{display:none !important;}
  .back-row{margin-bottom:10px;}
  small.muted{color:var(--muted);}

  /* LOGIN */
  .login-overlay{
    position:fixed; inset:0; background:var(--bg); z-index:2000;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-overlay.hidden{display:none;}
  .login-box{
    background:var(--card); border-radius:16px; padding:28px 22px; max-width:340px; width:100%;
    box-shadow:0 4px 20px rgba(0,0,0,.4); text-align:center;
  }
  .login-box h1{color:var(--accent2); margin-bottom:4px; font-size:20px;}
  .login-box p{color:var(--muted); font-size:13px; margin:0 0 16px;}
  .login-hint{font-size:12px !important; color:var(--muted); margin-top:10px !important;}
  .login-error{color:var(--danger); font-size:13px; margin-top:10px !important;}
  .loggedInName{font-size:13px; color:var(--muted); margin-right:4px;}
  .logout-btn{background:transparent; padding:4px 8px; font-size:16px;}
  .app-hidden{display:none !important;}
</style>
</head>
<body>

<div id="loginOverlay" class="login-overlay">
  <div class="login-box">
    <h1>🍺 KoeWi Bierlogger</h1>
    <p id="loginSubtitle">Bitte anmelden</p>
    <input id="loginName" placeholder="Dein Name (z.B. Faisst)" autocomplete="username">
    <input id="loginPw" type="password" placeholder="Passwort (min. 4 Zeichen)" autocomplete="current-password">
    <button class="btn-full btn-accent" onclick="doLogin()">Anmelden</button>
    <p id="loginHint" class="login-hint">Beim allerersten Login wird dein Passwort automatisch neu angelegt.</p>
    <p id="loginError" class="login-error hidden"></p>
  </div>
</div>

<div id="appRoot" class="app-hidden">

<header>
  <h1>🍺 KoeWi Bierlogger</h1>
  <div>
    <span id="loggedInName" class="loggedInName hidden"></span>
    <span id="statusDot"></span><span id="statusText">offline</span>
    <span id="queueBadge" class="queueBadge hidden">0</span>
    <button id="logoutBtn" class="logout-btn hidden" onclick="doLogout()">⏏</button>
  </div>
</header>

<main>

  <section id="view-log" class="view">
    <div class="card" id="catCard">
      <h2>Kategorie</h2>
      <div class="grid" id="catGrid"></div>
    </div>

    <div class="card hidden" id="nameCard">
      <div class="back-row"><button onclick="showCats()">⬅ Zurück</button></div>
      <h2 id="nameCardTitle">Wer?</h2>
      <div class="name-list" id="nameList"></div>
    </div>

    <div class="card hidden" id="mengeCard">
      <div class="back-row"><button onclick="backFromMenge()">⬅ Zurück</button></div>
      <h2 id="mengeTitle">Wie viel?</h2>
      <div class="grid" id="mengeGrid"></div>
    </div>
  </section>

  <section id="view-stand" class="view hidden">
    <div class="card">
      <h2>Aktueller Stand</h2>
      <button class="btn-full btn-accent" onclick="loadStand()">Stand laden</button>
      <div id="standResult" style="margin-top:12px; white-space:pre-wrap; font-size:14px;"></div>
    </div>
    <div class="card">
      <h2>Letzte Buchung stornieren</h2>
      <button class="btn-full btn-danger" onclick="doStorno()">Stornieren (5 Min. Frist)</button>
    </div>
  </section>

  <section id="view-admin" class="view hidden">
    <div class="card">
      <h2>Lager</h2>
      <button class="btn-full" onclick="loadLager()">Lagerstand anzeigen</button>
      <div id="lagerResult" style="margin-top:12px; white-space:pre-wrap; font-size:14px;"></div>
    </div>
    <div class="card">
      <h2>Einkauf</h2>
      <select id="einkaufSorte"></select>
      <input id="einkaufKisten" type="number" min="1" placeholder="Anzahl Kisten">
      <button class="btn-full btn-ok" onclick="doEinkauf()">Einkauf buchen</button>
    </div>
    <div class="card">
      <h2>Inventur</h2>
      <select id="inventurSorte"></select>
      <input id="inventurFlaschen" type="number" min="0" placeholder="Gezählte Flaschen gesamt">
      <button class="btn-full btn-accent" onclick="doInventur()">Inventur buchen</button>
    </div>
  </section>

</main>

<div class="tabbar">
  <button id="tab-log" class="active" onclick="switchTab('log')">Buchen</button>
  <button id="tab-stand" onclick="switchTab('stand')">Stand</button>
  <button id="tab-admin" onclick="switchTab('admin')">Admin</button>
</div>

</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
